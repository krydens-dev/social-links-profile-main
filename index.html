<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Social links profile</title>
  <link rel="stylesheet" href="design/styles.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <img class="profile-image" src="assets/images/avatar-jessica.jpeg" alt="Jessica Randall">
      <h1 class="name">Jessica Randall</h1>
      <p class="location">London, United Kingdom</p>
      <p class="bio">&quot;Front-end developer and avid reader.&quot;</p>
      <ul class="social-links">
        <li>
          <a class="social-link" href="#">GitHub</a>
        </li>
        <li>
          <a class="social-link" href="#">Frontend Mentor</a>
        </li>
        <li>
          <a class="social-link" href="#">LinkedIn</a>
        </li>
        <li>
          <a class="social-link" href="#">Twitter</a>
        </li>
        <li>
          <a class="social-link" href="#">Instagram</a>
        </li>
      </ul>
    </section>
  </main>
  <footer class="attribution">
    <p>Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="https://github.com/krydens-dev/social-links-profile-main" target="_blank">Christian Dinas</a>.</p>
  </footer>
</body>
</html>
